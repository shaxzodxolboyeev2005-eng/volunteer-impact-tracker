name: Backend Software Engineering CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Node.js environment
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: 'server/package.json'

    - name: Install Backend Dependencies
      run: |
        cd server
        npm install

    - name: Validate Code Syntax (Compilation Check)
      run: |
        cd server
        node --check src/controllers/impactController.js
